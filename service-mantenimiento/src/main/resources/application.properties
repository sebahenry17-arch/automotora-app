spring.application.name=service-mantenimiento
server.port=9007

spring.datasource.url=jdbc:mysql://localhost:3306/db_mantenimiento?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

springdoc.api-docs.path=/api/v1/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=true
springdoc.hateoas.enabled=false
springdoc.cache.disabled=true

spring.hateoas.use-hal-as-default-json-media-type=false